name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir work
          cd work
          unzip -oq ../AnkiBeeminder-v0.2.zip
          for z in $(find . -name '*.zip'); do unzip -oq "$z" -d "$(dirname "$z")"; done
          PROJ=$(dirname "$(find "$PWD" -name settings.gradle.kts | head -1)")
          echo "Project dir: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiBeeminder-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
